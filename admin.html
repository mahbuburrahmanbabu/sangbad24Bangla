<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সংবাদ ২৪ বাংলা — অ্যাডমিন</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f5f3;margin:0;padding:18px}
.box{max-width:600px;margin:20px auto;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #ccc}
h2{text-align:center;color:#075e36}
input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;font-size:16px}
textarea{min-height:180px}
button{background:#075e36;color:white;border:0;border-radius:6px;cursor:pointer}
button:disabled{opacity:.6}
#status{font-weight:bold;white-space:pre-wrap;overflow-wrap:anywhere}
label{display:block;margin-top:12px;font-weight:bold}
.hint{font-size:14px;color:#555}
</style>
</head>
<body>
<div class="box">
<h2>সংবাদ ২৪ বাংলা</h2>
<h3>অ্যাডমিন লগইন</h3>

<form id="loginForm">
<input id="email" type="email" placeholder="অ্যাডমিন ইমেইল" required>
<input id="password" type="password" placeholder="পাসওয়ার্ড" required>
<button type="submit">লগইন</button>
</form>

<div id="publisher" hidden>
<h3>নতুন সংবাদ প্রকাশ করুন</h3>
<form id="newsForm">
<input id="title" type="text" placeholder="সংবাদের শিরোনাম" required>
<input id="category" type="text" placeholder="বিভাগ (যেমন: বাংলাদেশ)" required>
<textarea id="content" placeholder="সংবাদের বিস্তারিত লিখুন" required></textarea>

<label for="newsImage">সংবাদের ছবি নির্বাচন করুন</label>
<input id="newsImage" type="file" accept="image/*">

<label for="newsVideo">সংবাদের ভিডিও নির্বাচন করুন</label>
<input id="newsVideo" type="file" accept="video/*">
<label for="youtubeUrl">YouTube ভিডিও লিংক দিন</label>
<input id="youtubeUrl" type="url" placeholder="https://www.youtube.com/watch?v=...">
<p class="hint">ছবি ও ভিডিও ঐচ্ছিক। বড় ভিডিও আপলোড হতে সময় লাগতে পারে।</p>
<button id="publishButton" type="submit">সংবাদ প্রকাশ করুন</button>
</form>
<button id="logout" type="button">লগআউট</button>
</div>

<p id="status" role="status" aria-live="polite"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore, collection, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyDAWw7VG0UyWq8HNaLnk7Y46xHlZSaYPco",
 authDomain: "sangbad24bangla-a9c20.firebaseapp.com",
 projectId: "sangbad24bangla-a9c20",
 storageBucket: "sangbad24bangla-a9c20.firebasestorage.app",
 messagingSenderId: "324521515174",
 appId: "1:324521515174:web:f89a4e4d629e2ac257fc67"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const status = document.getElementById("status");
const publishButton = document.getElementById("publishButton");

const CLOUD_NAME = "xtgo8tku";
const UPLOAD_PRESET = "news24_upload";

async function uploadToCloudinary(file, type) {
  const CHUNK_SIZE = 6 * 1024 * 1024;

  // ছবি আগের নিয়মেই আপলোড হবে
  if (type !== "video") {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", UPLOAD_PRESET);

    const response = await fetch(
      https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${type}/upload,
      { method: "POST", body: formData }
    );

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error?.message || "ছবি আপলোড ব্যর্থ হয়েছে।");
    }

    return result.secure_url;
  }

  // ভিডিও ছোট ছোট অংশে আপলোড হবে
  const uploadId =
    (crypto.randomUUID ? crypto.randomUUID() :
    Date.now() + "-" + Math.random());

  let start = 0;
  let finalResult = null;

  while (start < file.size) {
    const end = Math.min(start + CHUNK_SIZE, file.size);
    const formData = new FormData();

    formData.append("file", file.slice(start, end), file.name);
    formData.append("upload_preset", UPLOAD_PRESET);

    const result = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();

      xhr.open(
        "POST",
        https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload
      );

      xhr.setRequestHeader("X-Unique-Upload-Id", uploadId);
      xhr.setRequestHeader(
        "Content-Range",
        bytes ${start}-${end - 1}/${file.size}
      );

      xhr.upload.onprogress = event => {
        if (event.lengthComputable) {
          const percent = Math.round(
            ((start + event.loaded) / file.size) * 100
          );
          status.textContent = "ভিডিও আপলোড হচ্ছে... " + percent + "%";
        }
      };

      xhr.onload = () => {
        let data;

        try {
          data = JSON.parse(xhr.responseText);
        } catch {
          reject(new Error("Cloudinary থেকে সঠিক উত্তর পাওয়া যায়নি।"));
          return;
        }

        if (xhr.status >= 200 && xhr.status < 300) {
          resolve(data);
        } else {
          reject(new Error(
            data.error?.message || "ভিডিও আপলোড ব্যর্থ হয়েছে।"
          ));
        }
      };

      xhr.onerror = () => reject(
        new Error("ইন্টারনেট সংযোগের কারণে ভিডিও আপলোড হয়নি।")
      );

      xhr.send(formData);
    });

    finalResult = result;
    start = end;
  }

  if (!finalResult || !finalResult.secure_url) {
    throw new Error("ভিডিও আপলোড সম্পূর্ণ হয়নি।");
  }

  return finalResult.secure_url;
}
  });

  status.textContent = "সংবাদ সফলভাবে প্রকাশ হয়েছে!";
  document.getElementById("newsForm").reset();

 } catch (error) {
  console.error(error);
  status.textContent = "প্রকাশ করা যায়নি: " + error.message;
 } finally {
  publishButton.disabled = false;
 }
});

document.getElementById("logout").addEventListener("click", async () => {
 try {
  await signOut(auth);
  status.textContent = "লগআউট হয়েছে।";
 } catch (error) {
  status.textContent = "লগআউট হয়নি: " + error.message;
 }
});
</script>
</body>
</html>
