<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>সংবাদের বিস্তারিত | সংবাদ ২৪ বাংলা</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f5;margin:0;color:#222}
header{background:#087a43;color:white;padding:18px;text-align:center}
main{max-width:850px;margin:20px auto;background:white;padding:20px;border-radius:8px}
h1{font-size:25px;line-height:1.5}
#content{font-size:18px;line-height:1.9;white-space:pre-wrap}
img,video{max-width:100%;height:auto;margin:15px 0}
a{color:#087a43}
</style>
</head>
<body>
<header>
<h2>সংবাদ ২৪ বাংলা</h2>
<p>সত্যের সন্ধানে, সংবাদের সাথে</p>
</header>
<main>
<a href="index.html">← মূল পাতায় ফিরুন</a>
<h1 id="title">সংবাদের শিরোনাম</h1>
<img id="image" style="display:none">
<video id="video" controls style="display:none"></video>
<div id="content">সংবাদের বিস্তারিত লোড হচ্ছে...</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDAWw7VG0UyWq8HNaLnk7Y46xHlZSaYPco",
authDomain: "sangbad24bangla-a9c20.firebaseapp.com",
projectId: "sangbad24bangla-a9c20",
storageBucket: "sangbad24bangla-a9c20.firebasestorage.app",
 messagingSenderId: "324521515174",
appId: "1:324521515174:web:f89a4e4d629e2ac257fc67"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const id = new URLSearchParams(location.search).get("id");

async function loadNews(){
if(!id){document.getElementById("content").textContent="সংবাদের পরিচিতি পাওয়া যায়নি।";return;}
try{
const snap = await getDoc(doc(db,"news",id));
if(!snap.exists()){document.getElementById("content").textContent="সংবাদ পাওয়া যায়নি।";return;}
const data=snap.data();
document.getElementById("title").textContent=data.title || data.headline || "সংবাদের শিরোনাম";
document.getElementById("content").textContent=data.content || data.description || data.body || "";
if(data.imageUrl){
const img=document.getElementById("image");
img.src=data.imageUrl;img.style.display="block";
}
if(data.videoUrl){
const video=document.getElementById("video");
video.src=data.videoUrl;video.style.display="block";
}
 if(data.youtubeUrl){
const match = data.youtubeUrl.match(
/(?:youtu\.be\/|youtube\.com\/watch\?v=|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/
);

if(match){
document.getElementById("youtubeBox").innerHTML =
'<iframe width="100%" height="315" src="https://www.youtube.com/embed/' +
match[1] +
'" frameborder="0" allowfullscreen></iframe>';
}
}
}catch(error){
document.getElementById("content").textContent="সংবাদ লোড করা যায়নি।";
console.error(error);
}
}
loadNews();
</script>
 <div style="margin:20px 0;padding:15px;background:#f1f5f2;border-radius:8px">
<h3>সংবাদটি শেয়ার করুন</h3>

<a href="#" id="facebookShare" target="_blank"
style="display:inline-block;background:#1877F2;color:white;padding:10px;margin:5px;text-decoration:none;border-radius:5px">
Facebook Share
</a>

<a href="#" id="whatsappShare" target="_blank"
style="display:inline-block;background:#25D366;color:white;padding:10px;margin:5px;text-decoration:none;border-radius:5px">
WhatsApp Share
</a>

<button onclick="copyNewsLink()"
style="background:#444;color:white;padding:10px;border:0;border-radius:5px">
লিংক কপি
</button>
</div>

<h3>YouTube ভিডিও</h3>
<div id="youtubeBox"></div>

<script>
const newsUrl = window.location.href;

document.getElementById("facebookShare").href =
"https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(newsUrl);

document.getElementById("whatsappShare").href =
"https://api.whatsapp.com/send?text=" + encodeURIComponent(newsUrl);

function copyNewsLink(){
navigator.clipboard.writeText(newsUrl);
alert("সংবাদের লিংক কপি হয়েছে");
}
</script>
 <script>
const params = new URLSearchParams(window.location.search);
const youtubeLink = params.get("youtube");

if (youtubeLink) {
  const videoId = youtubeLink.match(
    /(?:youtu\.be\/|youtube\.com\/watch\?v=|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/
  );

  if (videoId) {
    document.getElementById("youtubeBox").innerHTML =
      '<iframe width="100%" height="315" src="https://www.youtube.com/embed/' +
      videoId[1] +
      '" frameborder="0" allowfullscreen></iframe>';
  }
}
</script>
</body>
</html>
